version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1
  aws-eks: circleci/aws-eks@2.2
  kubernetes: circleci/kubernetes@1.3

jobs:
  test-and-build:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Run frontend tests
          command: npm test
      - run:
          name: Build frontend
          command: npm run build
      - run:
          name: Install server dependencies
          command: cd server && npm ci
      - run:
          name: Run server tests
          command: cd server && npm test

  deploy-dev:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - setup_remote_docker
      - aws-cli/install
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
      - kubernetes/install-kubectl
      - run:
          name: Build and push Docker image
          command: |
            BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
            TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
            IMAGE_TAG="${BRANCH}-${TIMESTAMP}"
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker build -t johumole/landmark-web-app:$IMAGE_TAG .
            docker push johumole/landmark-web-app:$IMAGE_TAG
            echo "export IMAGE_TAG=$IMAGE_TAG" >> $BASH_ENV
      - run:
          name: Install Helm and eksctl
          command: |
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            curl --silent --location "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" | tar xz -C /tmp
            sudo mv /tmp/eksctl /usr/local/bin
      - run:
          name: Deploy to Kubernetes (develop namespace)
          command: |
            aws eks update-kubeconfig --name landmark-eks --region us-east-1
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            curl -o /tmp/iam-policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json
            aws iam create-policy --policy-name AWSLoadBalancerControllerIAMPolicy --policy-document file:///tmp/iam-policy.json 2>/dev/null || true
            eksctl utils associate-iam-oidc-provider --region us-east-1 --cluster landmark-eks --approve
            eksctl create iamserviceaccount \
              --cluster=landmark-eks \
              --namespace=kube-system \
              --name=aws-load-balancer-controller \
              --attach-policy-arn=arn:aws:iam::${ACCOUNT_ID}:policy/AWSLoadBalancerControllerIAMPolicy \
              --override-existing-serviceaccounts \
              --region us-east-1 \
              --approve
            helm repo add eks https://aws.github.io/eks-charts && helm repo update
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName=landmark-eks \
              --set serviceAccount.create=false \
              --set serviceAccount.name=aws-load-balancer-controller \
              --wait
            sed -i 's/name: landmark/name: develop/g' k8s/namespace.yml
            kubectl apply -f k8s/namespace.yml
            sed -i 's/namespace: landmark/namespace: develop/g' k8s/*.yml
            sed -i "s|image: landmark-technologies:latest|image: johumole/landmark-web-app:$IMAGE_TAG|g" k8s/app-deployment.yml
            kubectl apply -f k8s/

