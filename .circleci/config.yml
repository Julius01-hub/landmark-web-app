            helm repo add eks https://aws.github.io/eks-charts && helm repo update
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName=first-cluster \
              --set serviceAccount.create=false \
              --set serviceAccount.name=aws-load-balancer-controller \
              --wait
            sed -i 's/name: landmark/name: production/g' k8s/namespace.yml
            kubectl apply -f k8s/namespace.yml
            sed -i 's/namespace: landmark/namespace: production/g' k8s/*.yml
            sed -i "s|image: landmark-technologies:latest|image: johumole/landmark-web-app:$IMAGE_TAG|g" k8s/app-deployment.yml
            kubectl apply -f k8s/

workflows:
  build-and-deploy:
    jobs:
      - test-and-build
      - deploy-dev:
          context: develop
          requires:
            - test-and-build
          filters:
            branches:
              only: develop
      - deploy-stg:
          context: staging
          requires:
            - test-and-build
          filters:
            branches:
              only: /^release.*/
      - deploy-prod:
          context: production
          requires:
            - test-and-build
          filters:
            branches:
              only:
                - main
                - /^hotfix.*/
